# Render 설정 참고용 (무료 플랜) — 웹사이트(frontend/)와 API(backend/)를 한 서비스에서 제공
# 무료 계정에서는 Blueprint 대신 Dashboard 의 New > Web Service 로 아래 값을 그대로 입력한다.
#   Source        : Public Git Repository  https://github.com/crystalmoon74/sansa-maeum
#   Branch        : main
#   Root Directory: (비움 — 저장소 전체. frontend 변경도 자동 배포되도록)
#   Runtime       : Python 3   (버전은 저장소 루트의 .python-version)
#   Build Command : pip install -r backend/requirements.txt
#   Start Command : uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
#   Health Check  : /api/health
#   Instance Type : Free
# 환경 변수는 필요 없다. Render 위에서는 backend/app/config.py 의 공개 Supabase 설정(URL·publishable 키)을 기본값으로 쓴다.
services:
  - type: web
    name: sansa-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
